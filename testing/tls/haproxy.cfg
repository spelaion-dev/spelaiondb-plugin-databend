# HTTPS in front of the test server: TLS on 8443, Databend's plain HTTP handler behind it.
global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend https
  bind :8443 ssl crt /usr/local/etc/haproxy/server.pem
  default_backend databend

backend databend
  server databend databend:8000
